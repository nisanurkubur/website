<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone - Kodluyoruz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.1/css/all.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-sm navbar-light fixed-top border-bottom">
        <div class="logo">
            <a class="navbar-brand" href="#">
                <img src="insta.png" alt="logo">
            </a>
        </div>

        <div class="collapse navbar-collapse d-flex justify-content-center">
            <form class="form-inline ml-5 d-none d-sm-block">
                <input class="form-control search-input" type="search" placeholder="Ara" aria-label="Search">
            </form>
        </div>

        <div class="collapse navbar-collapse d-none d-sm-block ml-5 mt-2">
            <ul class="navbar-nav">
                <li class="nav-item active"><a class="nav-link" href="#"><i
                            class="fas fa-home fa-lg mr-3 text-dark"></i></a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i
                            class="fab fa-facebook-messenger fa-lg mr-3 text-dark"></i></a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i
                            class="far fa-compass fa-lg mr-3 text-dark"></i></a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="far fa-heart fa-lg mr-3 text-dark"></i></a>
                </li>
                <li class="nav-item">
                    <img src="p1.webp" class="rounded-circle mt-1" alt="profile" width="23" height="23"
                        style="object-fit: cover;">
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-2">
        <div class="row">
            <div class="col-12 col-md-6 offset-md-4 mt-2">

                <div class="card mb-3 middlearea">
                    <div class="card-body d-flex overflow-auto">
                        <div class="text-center mr-3">
                            <img src="p1.webp" class="rounded-circle mt-1" alt="profile" width="23" height="23"
                                style="object-fit: cover;">
                            <span class="storytext">kodluyoruz</span>
                        </div>
                        <div class="text-center mr-3">
                            <img src="p2.jpg" class="rounded-circle mt-1" alt="profile" width="23" height="23"
                                style="object-fit: cover;">
                            <span class="storytext">nisa..</span>
                        </div>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div>
                            <img src="p1.webp" class="rounded-circle mt-1" alt="profile" width="23" height="23"
                                style="object-fit: cover;">
                            <strong>cengizcmataraci</strong>
                        </div>
                        <i class="fas fa-ellipsis-h"></i>
                    </div>

                    <img src="https://blog.biletbayi.com/wp-content/uploads/2019/12/rize.jpg" class="card-img-top"
                        alt="post">

                    <div class="card-body p-0 ml-3 mt-3 no-border-area">
                        <div class="row no-gutters">
                            <div class="col-1"><i class="far fa-heart fa-lg"></i></div>
                            <div class="col-1"><i class="far fa-comment fa-lg"></i></div>
                            <div class="col-1"><i class="far fa-paper-plane fa-lg"></i></div>
                            <div class="col-1 offset-7 text-right pr-3"><i class="far fa-bookmark fa-lg"></i></div>
                        </div>
                    </div>

                    <div class="card-body">
                        <p class="card-text"><strong>cengizcmataraci</strong> Burası Rize! Harika bir cennet!</p>
                        <p class="text-muted" style="font-size: 13px;">15 yorumun tümünü gör</p>
                    </div>

                    <div class="card-footer d-flex justify-content-between">
                        <span class="text-muted">Yorum Ekle...</span>
                        <span class="text-primary font-weight-bold" style="cursor:pointer;">Paylaş</span>
                    </div>
                </div>
            </div>

            <div class="col-md-3 d-none d-lg-block">
                <div class="stickysidebar rightpanel">
                    <div class="d-flex align-items-center mb-4">
                        <img src="https://via.placeholder.com/60" class="rounded-circle border"
                            style="border-color: #ee2752 !important;">
                        <strong class="ml-3">cengizcmataraci</strong>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-muted font-weight-bold">Senin İçin Öneriler</span>
                        <span class="ml-auto font-weight-bold" style="font-size: 12px; cursor: pointer;">Tümünü
                            Gör</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span><img src="https://via.placeholder.com/30" class="rounded-circle mr-2"> kodluyoruz</span>
                        <span class="ml-auto text-primary font-weight-bold"
                            style="font-size: 12px; cursor: pointer;">Takip Et</span>
                    </div>
                    <p class="mt-4 text-muted" style="font-size: 11px;">
                        Hakkında Yardım Basın API İş Fırsatları Gizlilik Koşullar Konumlar...
                    </p>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
